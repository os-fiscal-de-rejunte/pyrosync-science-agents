[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrosync-science-agents"
version = "0.1.0"
description = "Evidence-grounded orchestration for PyroSync"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["pyrosync_science*"]
